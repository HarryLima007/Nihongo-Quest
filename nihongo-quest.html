<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Academia gamificada de japonês para brasileiros">
<meta name="theme-color" content="#191c4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style>
[hidden]{display:none!important}
/* Layout: coluna única de app (máx. 560px), barra de abas fixa embaixo, telas de lição em tela cheia por cima. */
:root {
  --bg: #f3f4fb;
  --surface: #ffffff;
  --surface-2: #eceefa;
  --text: #1c1f45;
  --muted: #62678f;
  --line: #dfe2f3;
  --royal: #3553d1;
  --violet: #6c43dd;
  --gold: #e9a91c;
  --gold-soft: #fff3d1;
  --gold-ink: #8a5a00;
  --night: #191c4a;
  --night-2: #2b1f6b;
  --ok: #1f9461;
  --ok-bg: #e2f6ec;
  --bad: #d23c55;
  --bad-bg: #fde7eb;
  --on-accent: #ffffff;
  --shadow: 0 6px 20px rgba(32, 36, 110, .10);
  --f-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1030; --surface: #191c42; --surface-2: #232756; --text: #eef0ff; --muted: #a2a7d4; --line: #2e3368;
    --royal: #7690ff; --violet: #a685ff; --gold: #ffc847; --gold-soft: #3a3016; --gold-ink: #ffd877;
    --night: #12143a; --night-2: #261b5e; --ok: #4fd393; --ok-bg: #133a2c; --bad: #ff7b90; --bad-bg: #42192a;
    --on-accent: #0e1030; --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1030; --surface: #191c42; --surface-2: #232756; --text: #eef0ff; --muted: #a2a7d4; --line: #2e3368;
  --royal: #7690ff; --violet: #a685ff; --gold: #ffc847; --gold-soft: #3a3016; --gold-ink: #ffd877;
  --night: #12143a; --night-2: #261b5e; --ok: #4fd393; --ok-bg: #133a2c; --bad: #ff7b90; --bad-bg: #42192a;
  --on-accent: #0e1030; --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 16px; line-height: 1.5; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.25; }
.jp { font-family: var(--f-display); }
.ro { color: var(--muted); font-size: .88em; }
.muted { color: var(--muted); }
.tabnum { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.section { padding-block: 18px 4px; display: flex; flex-direction: column; gap: 12px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-h h2 { font-size: 1.15rem; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; font-weight: 800; color: var(--muted); }

/* ---------- Cabeçalho noturno da academia ---------- */
.hero {
  position: relative; overflow: hidden; color: #f4f2ff;
  background:
    radial-gradient(1.5px 1.5px at 12% 22%, #fff9 50%, transparent 51%),
    radial-gradient(1px 1px at 32% 68%, #fff8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 18%, #ffe9a8 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 58%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 12%, #fff7 50%, transparent 51%),
    radial-gradient(120% 90% at 100% 0%, var(--night-2) 0%, var(--night) 60%);
  border-bottom: 3px solid var(--gold);
  border-radius: 0 0 26px 26px;
}
.hero-in { padding-block: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand-name { display: flex; flex-direction: column; }
.brand-name .jp { font-size: .8rem; letter-spacing: .2em; color: #ffd877; font-weight: 700; }
.brand-name strong { font-family: var(--f-display); font-size: 1.35rem; font-weight: 800; letter-spacing: .02em; }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #ffffff1a; border: 1px solid #ffffff26; font-weight: 800; font-size: .9rem; font-variant-numeric: tabular-nums; color: #fff; }
.stat-pill svg { width: 18px; height: 18px; }
.profile-card { display: flex; gap: 12px; align-items: center; }
.profile-card .avatar { width: 76px; height: 76px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #ffffff22, #ffffff08 70%); border: 2px solid #ffd87766; display: grid; place-items: center; }
.profile-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.profile-meta .name { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }
.rank { font-size: .85rem; color: #ffd877; font-weight: 700; }
.bar { height: 10px; border-radius: 999px; background: #ffffff22; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffd25e, #f2a91c); transition: width .6s ease; }
.bar.light { background: var(--surface-2); }
.bar.light > i { background: linear-gradient(90deg, var(--royal), var(--violet)); }
.xp-line { display: flex; justify-content: space-between; font-size: .78rem; opacity: .85; font-variant-numeric: tabular-nums; }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; letter-spacing: .01em; transition: transform .08s ease, filter .15s; user-select: none; }
.btn:active { transform: translateY(2px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--royal); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--royal) 60%, #000); }
.btn-gold { background: var(--gold); color: #2a1d00; box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 60%, #000); }
.btn-ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--ok) 60%, #000); }
.btn-bad { background: var(--bad); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.btn-ghost { background: var(--surface); color: var(--text); border: 2px solid var(--line); }
.btn-small { min-height: 38px; padding: 0 14px; font-size: .9rem; border-radius: 12px; }
.btn-block { width: 100%; }
.link-btn { color: var(--royal); font-weight: 800; padding: 6px 4px; }

/* ---------- Cartões ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.continue-card { display: flex; gap: 14px; align-items: center; }
.continue-card .emb { width: 58px; height: 58px; flex: none; border-radius: 16px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; color: #fff; background: linear-gradient(135deg, var(--royal), var(--violet)); border: 2px solid var(--gold); }
.continue-card .meta { min-width: 0; flex: 1; }
.continue-card h3 { font-size: 1.05rem; }
.progress-ring { display: flex; align-items: center; gap: 14px; }

.mascot-tip { display: flex; gap: 10px; align-items: flex-end; }
.mascot-tip .bubble { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: .95rem; box-shadow: var(--shadow); min-width: 0; }
.mascot-tip .bubble b { color: var(--violet); }

.missions { display: flex; flex-direction: column; gap: 10px; }
.mission { display: flex; gap: 12px; align-items: center; }
.mission .m-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; flex: none; }
.mission .m-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mission .m-txt { font-weight: 700; font-size: .95rem; }
.mission .m-sub { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.done-chip { font-size: .8rem; font-weight: 800; color: var(--ok); }

.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat-tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.cat-tile .emb { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; color: var(--violet); line-height: 1; }
.cat-tile .t { font-weight: 800; font-size: .92rem; line-height: 1.25; }
.cat-tile .s { font-size: .76rem; color: var(--muted); }
.cat-tile.locked { opacity: .62; }
.cat-tile.locked .emb { color: var(--muted); }

/* ---------- Mapa da academia ---------- */
.wing { padding-block: 16px 8px; }
.wing-head { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r); background: linear-gradient(135deg, var(--night), var(--night-2)); color: #f4f2ff; border: 1px solid #ffd87744; }
.wing-head .emb { width: 52px; height: 52px; flex: none; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; background: #ffffff14; border: 2px solid #ffd877; color: #ffd877; }
.wing-head .meta { min-width: 0; flex: 1; }
.wing-head h2 { font-size: 1.08rem; }
.wing-head .sub { font-size: .8rem; opacity: .85; }
.wing-head.locked { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.wing-head.locked .emb { border-color: var(--line); color: var(--muted); background: transparent; }
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 20px 8px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 132px; }
.node .disc { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; background: var(--surface-2); color: var(--muted); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); transition: transform .1s; }
.node:active .disc { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.node .lbl { font-size: .8rem; font-weight: 700; text-align: center; line-height: 1.2; color: var(--text); }
.node.open .disc { background: linear-gradient(135deg, var(--royal), var(--violet)); color: #fff; border-color: var(--gold); box-shadow: 0 5px 0 color-mix(in srgb, var(--violet) 55%, #000); }
.node.current .disc { animation: pulse 1.8s ease-in-out infinite; }
.node.done .disc { background: var(--gold); color: #2a1d00; border-color: color-mix(in srgb, var(--gold) 70%, #000); box-shadow: 0 5px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.exam .disc { border-radius: 22px; width: 78px; height: 78px; }
.node.soon .disc { border-style: dashed; box-shadow: none; font-size: .8rem; }
.node.soon .lbl { color: var(--muted); }
.node .badge { position: absolute; top: -6px; right: 22px; background: var(--ok); color: #fff; font-size: .7rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* ---------- Abas ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 10px; font-size: .72rem; font-weight: 800; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab.active { color: var(--royal); }
.tab.active::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.tab .dot { position: absolute; top: 6px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }

.page-title { padding-block: 18px 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.page-title h1 { font-size: 1.5rem; }
.page-title .jp { color: var(--violet); font-weight: 700; font-size: .85rem; letter-spacing: .14em; }

/* ---------- Revisão / caderno ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-size: 1.5rem; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: .76rem; color: var(--muted); font-weight: 700; line-height: 1.2; }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .jpw { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; min-width: 0; overflow-wrap: anywhere; }
.row .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 800; white-space: nowrap; }
.chip.nova { background: var(--surface-2); color: var(--muted); }
.chip.aprendendo { background: color-mix(in srgb, var(--royal) 15%, transparent); color: var(--royal); }
.chip.dominada { background: var(--ok-bg); color: var(--ok); }
.chip.revisar { background: var(--bad-bg); color: var(--bad); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter { flex: none; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: .85rem; }
.filter.on { background: var(--royal); border-color: var(--royal); color: #fff; }
.search { width: 100%; min-height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--text); padding: 0 14px; font: inherit; }
.nb-entry { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.nb-entry:last-child { border-bottom: 0; }
.nb-top { display: flex; align-items: center; gap: 10px; }
.nb-top .jpw { font-family: var(--f-display); font-size: 1.35rem; font-weight: 800; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.nb-ex { background: var(--surface-2); border-radius: 12px; padding: 8px 12px; font-size: .9rem; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--royal); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- Perfil ---------- */
.ach-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ach { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.ach .medal { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 60%, #b97a00); color: #3a2600; border: 3px solid #ffe08a; }
.ach .an { font-size: .78rem; font-weight: 800; line-height: 1.2; }
.ach.off .medal { background: var(--surface-2); color: var(--muted); border-color: var(--line); filter: grayscale(1); }
.ach.off .an { color: var(--muted); }
.medal-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cmedal { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.cmedal .m { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; color: #2b1d00; }
.m.ouro { background: radial-gradient(circle at 35% 30%, #fff3c4, #e9a91c 65%); }
.m.prata { background: radial-gradient(circle at 35% 30%, #ffffff, #a9b1c9 65%); }
.m.bronze { background: radial-gradient(circle at 35% 30%, #ffe0c4, #c27a3c 65%); }
.m.none { background: var(--surface-2); color: var(--muted); }
.cmedal .t { font-size: .8rem; font-weight: 800; line-height: 1.2; min-width: 0; }
.shop-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.shop-item:last-child { border-bottom: 0; }
.shop-item .si { width: 52px; height: 52px; flex: none; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.shop-item .grow { flex: 1; min-width: 0; }
.shop-item .n { font-weight: 800; }
.shop-item .d { font-size: .8rem; color: var(--muted); }
.setting { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; flex: none; }
.seg button { padding: 6px 10px; border-radius: 9px; font-weight: 800; font-size: .82rem; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--royal); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toggle { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle.on { background: var(--ok); }
.toggle.on::after { transform: translateX(22px); }
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* ---------- Tela da lição (player) ---------- */
.player { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.player[hidden] { display: none !important; }
.p-top { flex: none; display: flex; align-items: center; gap: 12px; padding-block: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.p-top .bar { flex: 1; height: 14px; background: var(--surface-2); }
.p-top .bar > i { background: linear-gradient(90deg, var(--gold), #ffd25e); }
.p-close { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; }
.p-close svg { width: 24px; height: 24px; }
.p-count { font-weight: 800; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in { max-width: 560px; margin: 0 auto; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 16px; }
.p-foot { flex: none; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.p-foot-in { max-width: 560px; margin: 0 auto; padding-block: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.p-foot.ok { background: var(--ok-bg); border-color: transparent; }
.p-foot.bad { background: var(--bad-bg); border-color: transparent; }
.fb { display: flex; gap: 12px; align-items: flex-start; }
.fb .fb-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.fb h3 { font-size: 1.1rem; }
.p-foot.ok h3 { color: var(--ok); }
.p-foot.bad h3 { color: var(--bad); }
.fb p { margin: 0; font-size: .93rem; }
.fb .answer { font-weight: 800; }
.mode-tag { align-self: flex-start; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); }

'use strict';
/* ==========================================================
   Nihongo Quest — lógica do app
   ========================================================== */
const APP_VERSION = '2.0.0';
const SCHEMA_VERSION = 2;
const SAVE_KEY = 'nihongoQuest:save';
const BACKUP_KEY = 'nihongoQuest:backup';
const PASS = 80;
const SRS_DAYS = [0, 1, 2, 4, 7, 15];

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sp = s => { const i = String(s).indexOf('|'); return i < 0 ? { jp: String(s), ro: '' } : { jp: s.slice(0, i), ro: s.slice(i + 1) }; };
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function dayDiff(a, b) { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000); }
const isPlainObj = o => o && typeof o === 'object' && !Array.isArray(o);
const isKanaOnly = s => /^[぀-ゟ゠-ヿ]+$/.test(s);

/* ---------- índice do conteúdo ---------- */
const LESSON = {}, ITEM = {}, CAT = {};

CATS.forEach(c => {
  CAT[c.id] = c;
  c.lessons.forEach((l, i) => {

    l.items.forEach(it => { it.id = l.id + ':' + it.k; it.lesson = l; ITEM[it.id] = it; });
  });
});
const TOTAL_LESSONS = ALL_LESSONS.length;
/* itens da Academia Auditiva (2.0) entram no mesmo índice, com ids estáveis "pacote:chave" */

});

/* ---------- salvamento ---------- */
function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, createdAt: Date.now(), updatedAt: Date.now(),
    profile: { name: '', onboarded: false },
    xp: 0, coins: 20,
    streak: { current: 0, best: 0, last: null, freezes: 1 },
    lessons: {}, catExams: {}, items: {}, history: [],
    achievements: {}, daily: { day: null, missions: [] },
    stats: { answers: 0, correct: 0, lessonsPassed: 0, perfect: 0, reviews: 0, missionsDone: 0, studyDays: 0 },
    shop: { owned: [], equipped: null },
    flags: { comeback: false },
    settings: { romaji: true, sound: true, theme: 'system', rate: 'normal', academyMode: 'trad' },
    listening: defaultListening(),
    discoveries: {}
  };
}
function defaultListening() {
  const ac = () => ({ a: 0, c: 0 });
  return {
    level: 'iniciante',
    stats: { answers: 0, correct: 0, ms: 0, sessions: 0,
      byLevel: { iniciante: ac(), intermediario: ac(), avancado: ac() },
      byType: { palavra: ac(), som: ac(), frase: ac(), expressao: ac(), anime: ac(), dialogo: ac() } },
    recognized: {}, phrases: {}, dialogs: {}
  };
}
/* Migrações: MIGRATIONS[n] converte um save da versão n para n+1.
   Futuras versões: adicione MIGRATIONS[1] = s => {...; return s} e aumente SCHEMA_VERSION. */
const MIGRATIONS = {
  0: s => { // saves sem versão (protótipos) -> v1
    if (typeof s.xp !== 'number') s.xp = Number(s.xp) || 0;
    if (s.completed && !s.lessons) { s.lessons = {}; Object.keys(s.completed).forEach(id => { s.lessons[id] = { passed: true, best: 80, attempts: 1 }; }); delete s.completed; }
    return s;
  },
  1: s => { // 1.0 -> 2.0: só ACRESCENTA campos; nada da v1 é removido ou alterado
    if (!isPlainObj(s.listening)) s.listening = defaultListening();
    if (!isPlainObj(s.discoveries)) s.discoveries = {};
    if (!isPlainObj(s.settings)) s.settings = {};
    if (!s.settings.rate) s.settings.rate = 'normal';
    if (!s.settings.academyMode) s.settings.academyMode = 'trad';
    s.migratedFrom = s.migratedFrom || { schema: 1, at: Date.now() };
    return s;
  }
};
function fillDefaults(target, def) {
  Object.keys(def).forEach(k => {
    if (!(k in target) || target[k] === null && def[k] !== null) target[k] = def[k];
    else if (isPlainObj(def[k]) && isPlainObj(target[k]) && Object.keys(def[k]).length) fillDefaults(target[k], def[k]);
  });
  return target;
}
let storageOK = true, loadNotice = '';
function normalize(data) {
  if (!isPlainObj(data)) throw new Error('Formato inválido');
  let v = Number(data.schemaVersion) || 0;
  let s = JSON.parse(JSON.stringify(data));
  if (v > SCHEMA_VERSION) loadNotice = 'Este progresso foi salvo por uma versão mais nova do app. Tudo foi mantido.';
  while (v < SCHEMA_VERSION) { const m = MIGRATIONS[v]; if (m) s = m(s) || s; v++; s.schemaVersion = v; }
  s = fillDefaults(s, defaultState());
  ['lessons', 'catExams', 'items', 'achievements'].forEach(k => { if (!isPlainObj(s[k])) s[k] = {}; });
  if (!Array.isArray(s.history)) s.history = [];
  if (!Array.isArray(s.shop.owned)) s.shop.owned = [];
  if (!Array.isArray(s.daily.missions)) s.daily.missions = [];
  s.xp = Math.max(0, Number(s.xp) || 0); s.coins = Math.max(0, Number(s.coins) || 0);
  s.schemaVersion = Math.max(SCHEMA_VERSION, Number(data.schemaVersion) || 0);
  s.appVersion = APP_VERSION;
  return s;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { storageOK = false; }
  if (!raw) return defaultState();
  try {
    const data = JSON.parse(raw);
    const oldV = Number(data.schemaVersion) || 0;
    if (oldV < SCHEMA_VERSION) {
      // cópia de segurança antes de migrar: chave padrão + uma por versão que nunca é sobrescrita
      try { localStorage.setItem(BACKUP_KEY, raw); } catch (e) {}
      try { const k = BACKUP_KEY + ':schema' + oldV; if (!localStorage.getItem(k)) localStorage.setItem(k, raw); } catch (e) {}
    }
    return normalize(data);
  } catch (e) {
    try { localStorage.setItem(SAVE_KEY + ':corrompido:' + Date.now(), raw); } catch (_) {}
    loadNotice = 'Não consegui ler o progresso salvo. Uma cópia foi guardada e um novo perfil foi criado.';
    return defaultState();
  }
}
let S = load();
let saveTimer = null;
let saveSuspended = false;
function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  if (saveSuspended) return;
  S.updatedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { if (storageOK) toast('!', 'Não foi possível salvar automaticamente. Use Perfil → Exportar progresso.'); storageOK = false; }

/* ---------- sequência diária (sem punição pesada) ---------- */
function streakView() {

  if (d === 1) return { n: st.current, state: 'pending' };

}

  let h = hashStr(today), pool = MISSION_POOL.slice(), chosen = [];

const DIG = [null, ['いち', 'ichi'], ['に', 'ni'], ['さん', 'san'], ['よん', 'yon'], ['ご', 'go'], ['ろく', 'roku'], ['なな', 'nana'], ['はち', 'hachi'], ['きゅう', 'kyuu']];

  if (n === 10) return { jp: 'じゅう', ro: 'juu', how: '' };
  const t = Math.floor(n / 10), o = n % 10;
  const jp = (t > 1 ? DIG[t][0] : '') + 'じゅう' + (o ? DIG[o][0] : '');
  const ro = (t > 1 ? DIG[t][1] : '') + 'juu' + (o ? DIG[o][1] : '');
  const how = (t > 1 ? t + ' × 10' : '10') + (o ? ' + ' + o : '') + ' = ' + (t > 1 ? DIG[t][0] + ' + ' : '') + 'じゅう' + (o ? ' + ' + DIG[o][0] : '');

  const cands = [n + 1, n - 1, n + 10, n - 10, o * 10 + t, t * 10 + ((o + 2) % 10), n + 5];

}

/* ---------- toasts, modal, confete ---------- */
function toast(icon, text) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="ti">${esc(icon)}</span><span>${esc(text)}</span>`;
  box.appendChild(el);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2800);
}
function openModal(html, cls = '') { const m = $('#modal'); m.innerHTML = `<div class="sheet wrap ${cls}" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; }
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; setTimeout(flushPending, 50); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('div'); c.className = 'confetti';
  const cols = ['#f2b632', '#6c43dd', '#3553d1', '#ffffff', '#ff8fb0'];
  for (let i = 0; i < 46; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = pick(cols); p.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; p.style.animationDelay = Math.random() * .4 + 's'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
}
function flushPending() {
  if (P || !$('#modal').hidden || !pending.length) return;
  const ev = pending.shift();
  if (ev.type === 'level') {
    const r = rankOf(ev.level); sfx('level'); confetti();
    openModal(`<div class="stack" style="align-items:center">${mascot('wow', 120, 'hop')}<span class="eyebrow">Subiu de nível!</span><h2>Nível ${ev.level}</h2><p class="muted" style="margin:0">Título: <b>${esc(r.name)}</b> <span class="jp">${esc(r.jp)}</span></p><p style="margin:0">${MASCOT_NAME}: “Você está brilhando cada vez mais! Vamos continuar?”</p><button class="btn btn-gold btn-block" data-act="closeModal">Continuar</button></div>`, 'center');
  } else if (ev.type === 'comeback') {
    openModal(`<div class="stack" style="align-items:center">${mascot('happy', 110, 'hop')}<h2>Que bom te ver de novo!</h2><p style="margin:0">Sua sequência recomeça hoje, mas <b>todo o seu XP, moedas, conquistas e lições continuam aqui</b>. Uma liçãozinha já coloca a chama acesa de novo.</p><button class="btn btn-primary btn-block" data-act="closeModal">Vamos lá!</button></div>`, 'center');
  }
}

function render() {
  const root = $('#view');

  ensureDaily();
  root.innerHTML = ({ inicio: viewHome, academia: viewAcademyRoot, revisao: viewReview, caderno: viewNotebook, perfil: viewProfile }[view] || viewHome)();
  document.querySelectorAll('.tab').forEach(t => { t.classList.toggle('active', t.dataset.view === view); t.setAttribute('aria-current', t.dataset.view === view ? 'page' : 'false'); });

}
function updateTabDots() {
  const tabs = document.querySelectorAll('.tab'); if (!tabs.length) return;
  const claim = S.daily.missions.some(m => { const d = MISSION_POOL.find(x => x.id === m.id); return d && !m.claimed && m.progress >= d.goal; });
  const due = dueItems().length > 0;
  tabs.forEach(t => { const dot = t.querySelector('.dot'); const on = (t.dataset.view === 'inicio' && claim) || (t.dataset.view === 'revisao' && due); if (dot) dot.hidden = !on; });
}
function go(v) { if (!VIEWS.includes(v)) v = 'inicio'; view = v; if (location.hash !== '#' + v) { try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; } } render(); window.scrollTo(0, 0); }

function viewAcademy() {
  const offs = [0, 46, 70, 46, 0, -46, -70, -46];
  const nx = nextStep();
  const wings = CATS.map(c => {
    const unlocked = catUnlocked(c), has = catHasContent(c), p = catProgress(c);
    let sub = !has ? 'Em breve' : !unlocked ? 'Bloqueada' : p.done + ' de ' + p.tot + ' etapas';
    const head = `<div class="wing-head ${unlocked && has ? '' : 'locked'}"><div class="emb">${esc(c.emblem)}</div><div class="meta"><span class="sub">Categoria ${c.num} · <span class="jp">${esc(c.jp)}</span></span><h2>${esc(c.title)}</h2><span class="sub">${sub}</span></div>${unlocked && has ? '' : IC.lock}</div>`;
    let nodes = [], k = 0;
    c.lessons.forEach(l => {
      const done = lessonPassed(l.id), open = lessonUnlocked(l), cur = nx && nx.lesson === l;
      const best = S.lessons[l.id] ? S.lessons[l.id].best : null;
      nodes.push(`<button class="node ${done ? 'done' : open ? 'open' : ''} ${cur ? 'current' : ''}" style="transform:translateX(${offs[k++ % 8]}px)" data-act="openLesson" data-id="${l.id}" aria-label="${esc(l.title)}${done ? ' (aprovada)' : open ? '' : ' (bloqueada)'}"><span class="disc jp">${open || done ? esc(l.emblem) : IC.lock}</span>${done && best != null ? `<span class="badge">${best}%</span>` : ''}<span class="lbl">${esc(l.title)}</span></button>`);
    });
    if (has) {
      const done = catPassed(c.id), open = examUnlocked(c);
      nodes.push(`<button class="node exam ${done ? 'done' : open ? 'open' : ''} ${nx && nx.exam === c ? 'current' : ''}" style="transform:translateX(${offs[k++ % 8]}px)" data-act="openCatExam" data-cat="${c.id}"><span class="disc jp">${open || done ? '試' : IC.lock}</span><span class="lbl">Avaliação final</span></button>`);
    }
    const soon = c.soon.length ? `<div class="soon-box"><span class="eyebrow">${has ? 'Próximas lições · em breve' : 'Conteúdo planejado · em breve'}</span><ul>${c.soon.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : '';
    const req = has && !unlocked ? `<p class="muted" style="margin:10px 4px 0;font-size:.88rem">${esc(reqText(c))}</p>` : '';
    return `<section class="wing" id="wing-${c.id}">${head}${req}${nodes.length ? `<div class="path">${nodes.join('')}</div>` : ''}${soon}</section>`;
  }).join('');
  return `<div class="wrap"><div class="page-title"><div><span class="jp">がくえん</span><h1>Mapa da Academia</h1></div></div>
  <p class="muted" style="margin:0">Cada categoria é uma ala da Academia. Passe nas avaliações (mínimo de ${PASS}%) para abrir o próximo caminho.</p>${wings}</div>`;
}

function viewProfile() {
  const li = levelInfo(S.xp), r = rankOf(li.level), acc = S.stats.answers ? Math.round(S.stats.correct / S.stats.answers * 100) : 0;
  const medals = CATS.filter(catHasContent).map(c => {

    const name = { none: 'Sem medalha', ouro: 'Ouro', prata: 'Prata', bronze: 'Bronze' }[m];
    return `<div class="cmedal"><span class="m ${m} jp">${esc(c.emblem)}</span><span class="t">${esc(c.title)}<br><span class="muted" style="font-weight:700">${name}${best != null ? ' · ' + best + '%' : ''}</span></span></div>`;
  }).join('');
  const achs = ACHIEVEMENTS.map(a => `<button class="ach ${S.achievements[a.id] ? '' : 'off'}" data-act="achInfo" data-id="${a.id}"><span class="medal">${esc(a.icon)}</span><span class="an">${esc(a.name)}</span></button>`).join('');
  const shop = SHOP.map(it => {
    const owned = S.shop.owned.includes(it.id), eq = S.shop.equipped === it.id;
    let btn;

      <button class="btn btn-small btn-ghost" style="background:#ffffff1a;color:#fff;border-color:#ffffff33" data-act="editName">Editar</button></div>

    <div class="wrap">
    <section class="section"><h2 style="font-size:1.1rem">Academia tradicional</h2><div class="stats-grid">
      <div class="kpi"><b>${countPassed(S)}</b><span>lições aprovadas</span></div><div class="kpi"><b>${acc}%</b><span>de acertos no total (${S.stats.correct}/${S.stats.answers})</span></div>
      <div class="kpi"><b>${S.streak.best}</b><span>melhor sequência (dias)</span></div><div class="kpi"><b>${S.stats.reviews}</b><span>revisões feitas</span></div></div></section>
    ${profileListenStats()}
    <section class="section"><h2 style="font-size:1.1rem">Medalhas das categorias</h2><p class="muted" style="margin:0;font-size:.85rem">Bronze a partir de 80%, prata com 90% e ouro com 100% na avaliação final.</p><div class="medal-row">${medals}</div></section>

    <p class="muted" style="text-align:center;font-size:.78rem">Nihongo Quest v${APP_VERSION} · dados v${S.schemaVersion}</p></div>`;
}

/* ==========================================================
   PLAYER (teoria, exercícios, avaliações)
   ========================================================== */
let P = null;
function openPlayer() { $('#player').hidden = false; document.body.style.overflow = 'hidden'; }
function closePlayer() { stopAudio(); P = null; sessionGain = null; $('#player').hidden = true; $('#player').innerHTML = ''; document.body.style.overflow = ''; render(); setTimeout(flushPending, 200); }

function startLesson(id, mode = 'full') {
  const L = LESSON[id]; if (!L || !lessonUnlocked(L)) return;
  closeModal();
  P = { kind: 'lesson', L, mode, phase: mode === 'exam' ? 'examIntro' : 'theory', card: 0 };
  sessionGain = { xp: 0, coins: 0 };
  openPlayer(); renderPlayer();
}
function startCatExam(cid) {
  const c = CAT[cid]; if (!c || !examUnlocked(c)) return;
  closeModal();
  P = { kind: 'catexam', C: c, phase: 'examIntro' };
  sessionGain = { xp: 0, coins: 0 };
  openPlayer(); renderPlayer();
}
function startReview(mode) {
  const qs = buildReview(mode);
  if (!qs.length) { toast('復', 'Estude uma lição primeiro para ter o que revisar.'); return; }
  P = { kind: 'review', mode, phase: 'quiz', quiz: 'review' };
  sessionGain = { xp: 0, coins: 0 };
  setupQuiz(qs, 'review'); openPlayer(); renderPlayer();
}
function setupQuiz(qs, quiz) { Object.assign(P, { phase: 'quiz', quiz, qs, i: 0, total: qs.length, correct: 0, graded: 0, errors: [], answered: false, sel: null, built: [], match: null }); }

function playerShell(progress, body, foot, footCls = '', countTxt = '') {
  return `<div class="p-top wrap"><button class="p-close" data-act="pClose" aria-label="Sair">${IC.close}</button><div class="bar"><i style="width:${Math.round(progress * 100)}%"></i></div><span class="p-count">${countTxt}</span></div>
  <div class="p-body" id="pBody"><div class="p-body-in wrap">${body}</div></div>
  <div class="p-foot ${footCls}"><div class="p-foot-in wrap">${foot}</div></div>`;
}
function renderPlayer() {
  if (!P) return;
  const el = $('#player');
  if (P.phase === 'theory') el.innerHTML = renderTheory();
  else if (P.phase === 'examIntro') el.innerHTML = renderExamIntro();
  else if (P.phase === 'quiz') el.innerHTML = renderQuiz();
  else if (P.phase === 'result') el.innerHTML = renderResult();
  else if (P.phase === 'confirmExit') el.innerHTML = renderConfirmExit();
  else if (P.phase === 'dialog') el.innerHTML = renderDialogLab();
  const b = $('#pBody'); if (b && !P.keepScroll) b.scrollTop = 0; P.keepScroll = false;
  const inp = $('#numInput'); if (inp) setTimeout(() => inp.focus(), 50);
  afterRenderPlayer();
}
function renderConfirmExit() {
  return playerShell(0, `<div class="result-hero">${mascot('sad', 120)}<h2>Sair agora?</h2><p class="muted" style="margin:0">${P.prev === 'theory' ? 'Você pode voltar à teoria quando quiser.' : 'As respostas desta tentativa não contarão para a aprovação. O XP já ganho fica com você.'}</p></div>`,
    `<button class="btn btn-primary btn-block" data-act="pStay">Continuar estudando</button><button class="btn btn-ghost btn-block" data-act="pExit">Sair</button>`);
}

/* --- teoria --- */
function theoryCards(L) {
  const cards = [{ t: 'intro' }]; L.items.forEach(it => cards.push({ t: 'item', it })); cards.push({ t: 'examples' }); return cards;
}
function renderTheory() {
  const L = P.L, cards = theoryCards(L), c = cards[P.card], last = P.card === cards.length - 1;
  let body = '';
  if (c.t === 'intro') {
    body = `<span class="mode-tag">Teoria · ${esc(L.cat.title)}</span><h1 style="font-size:1.5rem">${esc(L.title)}</h1>
      <div class="theory-card">${L.intro.map(p => `<p>${esc(p)}</p>`).join('')}</div>
      <div class="mascot-tip">${mascot('happy', 64)}<div class="bubble"><b>Dica da ${MASCOT_NAME}:</b> ${esc(L.tip)}</div></div>`;
  } else if (c.t === 'item') {
    const it = c.it; markSeen(it.id);
    const huge = L.kind === 'kana';
    body = `<span class="mode-tag">Teoria · ${P.card} de ${L.items.length}</span>
      <div class="theory-card"><div class="t-word"><span class="big ${huge ? 'huge' : ''}">${esc(it.jp)}</span><span class="rr">${esc(it.ro)}</span><span class="pt">${esc(it.pt)}</span>${speakBtn(it.jp)}</div>
      <dl class="kv"><dt>Japonês</dt><dd class="jp">${esc(it.jp)}</dd><dt>Romaji</dt><dd>${esc(it.ro)}</dd><dt>Tradução</dt><dd>${esc(it.pt)}</dd>${it.alt ? `<dt>Outra leitura</dt><dd>${esc(it.alt)}</dd>` : ''}${it.kanji ? `<dt>Em kanji</dt><dd class="jp">${esc(it.kanji)} <span class="muted" style="font-family:var(--f-body);font-size:.85rem">(você verá na categoria Kanji)</span></dd>` : ''}</dl>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
      ${it.ex ? `<div><span class="eyebrow">Exemplo</span><div class="ex"><span class="ej">${esc(it.ex.jp)}</span><span class="ro">${esc(it.ex.ro)}</span><span class="ep">${esc(it.ex.pt)}</span></div></div>` : ''}</div>`;
  } else {
    body = `<span class="mode-tag">Teoria · Na prática</span><h2>Exemplos práticos</h2>
      <div class="theory-card">${L.examples.map(e => `<div class="ex"><span class="ej">${esc(e.jp)}</span><span class="ro">${esc(e.ro)}</span><span class="ep">${esc(e.pt)}</span></div>`).join('')}</div>
      <div class="mascot-tip">${mascot('wow', 64)}<div class="bubble"><b>${MASCOT_NAME}:</b> ${P.mode === 'theory' ? 'Revisão da teoria concluída! Quer testar seus conhecimentos?' : 'Agora vamos praticar! Na prática você vê a explicação depois de cada resposta, sem pressão. Depois vem a avaliação.'}</div></div>`;
  }
  body += `<div class="dots">${cards.map((_, i) => `<i class="${i === P.card ? 'on' : ''}"></i>`).join('')}</div>`;
  const foot = `<div class="row-btns">${P.card > 0 ? '<button class="btn btn-ghost" data-act="tPrev">Voltar</button>' : ''}${last
    ? (P.mode === 'theory' ? '<button class="btn btn-ghost" data-act="pExit">Concluir</button><button class="btn btn-gold" data-act="toExamIntro">Avaliação</button>' : '<button class="btn btn-gold" data-act="toPractice">Praticar</button>')
    : '<button class="btn btn-primary" data-act="tNext">Próximo</button>'}</div>`;
  return playerShell((P.card + 1) / cards.length, body, foot, '', (P.card + 1) + '/' + cards.length);
}

/* --- introdução da avaliação --- */
function renderExamIntro() {
  const isCat = P.kind === 'catexam';
  const title = isCat ? 'Avaliação final: ' + P.C.title : 'Avaliação: ' + P.L.title;
  const prev = isCat ? S.catExams[P.C.id] : S.lessons[P.L.id];
  const n = isCat ? '15' : 'cerca de 10';
  const body = `<div class="result-hero">${mascot('neutral', 120)}<span class="mode-tag">Avaliação</span><h2>${esc(title)}</h2>
    <p style="margin:0">São ${n} perguntas, uma de cada vez. Você precisa acertar pelo menos <b>${PASS}%</b> para ser aprovado${isCat ? ' e liberar a próxima ala da Academia' : ' e liberar a próxima lição'}.</p>
    <p class="muted" style="margin:0">Depois de cada resposta eu mostro uma explicação. Se não passar, pode tentar de novo quantas vezes quiser!${isCat ? '' : ' Algumas perguntas revisam lições anteriores.'}</p>
    ${prev && prev.attempts ? `<p class="muted tabnum" style="margin:0">Tentativas: ${prev.attempts} · Melhor nota: ${prev.best}%</p>` : ''}</div>`;
  return playerShell(0, body, `<button class="btn btn-gold btn-block" data-act="startExam">Começar avaliação</button>`);
}

/* --- perguntas --- */
function showRo(q) { return S.settings.romaji && !q.noRomaji; }
function optHTML(o, i, q) {
  let cls = 'opt';
  if (P.answered) { if (o.correct) cls += ' right'; else if (i === P.sel) cls += ' wrong'; }
  else if (i === P.sel) cls += ' sel';
  const sub = o.sub && showRo(q) ? `<span class="o-ro">${esc(o.sub)}</span>` : '';
  const label = o.plain ? `<span>${esc(o.label)}</span>` : `<span class="o-jp ${o.kana ? 'kana' : ''}">${esc(o.label)}</span>`;
  return `<button class="${cls}" data-act="opt" data-i="${i}" ${P.answered ? 'disabled' : ''}>${label}${sub}</button>`;
}
function renderQuiz() {
  const q = P.qs[P.i];
  const label = { practice: 'Prática', review: 'Revisão', listen: 'Treino auditivo', dialog: 'Diálogo', case: 'Caso do Detetive' }[P.quiz] || 'Avaliação';
  let tag = `<span class="mode-tag ${q.review || P.quiz === 'review' ? 'rev' : ''}">${label}${q.review ? ' · revisão de lição anterior' : ''}${q.retry ? ' · de novo' : ''}${q.tag ? ' · ' + esc(q.tag) : ''}</span>`;
  let body = tag + `<div class="q-prompt">${esc(q.prompt)}</div>`;
  let canCheck = false;
  if (q.type === 'mc') {
    if (q.big || q.ctx) {
      const bigCls = q.bigClass === 'fill' ? 'fill-sentence' : 'big ' + (q.bigClass || '');
      body += `<div class="q-hero"><div class="q-card">${q.big ? `<span class="${bigCls} ${q.bigClass === 'fill' ? 'jp' : ''}">${esc(q.big)}</span>` : ''}${q.ro && showRo(q) ? `<span class="ro">${esc(q.ro)}</span>` : ''}${q.ctx ? `<span class="ctx">${esc(q.ctx)}</span>` : ''}${q.big && q.bigClass !== 'pt' && q.bigClass !== 'fill' && !q.noRomaji ? speakBtn(q.big) : ''}</div></div>`;
    }
    body += `<div class="opts ${q.grid ? 'grid' : ''}">${q.options.map((o, i) => optHTML(o, i, q)).join('')}</div>`;
    canCheck = P.sel !== null;
  } else if (q.type === 'listen') {
    body += renderListenBody(q);
    canCheck = P.sel !== null;
  } else if (q.type === 'num_type') {
    body += `<div class="q-card"><span class="big">${esc(q.jp)}</span>${showRo(q) ? `<span class="ro">${esc(q.ro)}</span>` : ''}${speakBtn(q.jp)}</div>
      <input id="numInput" class="num-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="?" value="${esc(P.typed || '')}" ${P.answered ? 'disabled' : ''} aria-label="Número em algarismos">`;
    canCheck = !!(P.typed && P.typed.trim());
  } else if (q.type === 'build') {
    if (q.jp) body += `<div class="q-card"><span class="big" style="font-size:1.6rem">${esc(q.jp)}</span>${showRo(q) ? `<span class="ro">${esc(q.ro)}</span>` : ''}${speakBtn(q.jp)}</div>`;
    if (q.ctx) body += `<div class="q-card"><span class="ctx">Significado</span><span style="font-weight:800;font-size:1.2rem">${esc(q.ctx)}</span></div>`;
    const tileHTML = (t, i, inLine) => `<button class="tile ${!inLine && P.built.includes(i) ? 'used' : ''}" data-act="${inLine ? 'unbuild' : 'build'}" data-i="${i}" ${P.answered ? 'disabled' : ''}>${q.plainTiles ? `<span>${esc(t.jp)}</span>` : `<span class="t-jp ${q.kanaTiles ? 'kana' : ''}">${esc(t.jp)}</span>${t.ro && showRo(q) ? `<span class="t-ro">${esc(t.ro)}</span>` : ''}`}</button>`;
    body += `<div class="answer-line ${P.built.length ? '' : 'empty'}">${P.built.map(i => tileHTML(q.bank[i], i, true)).join('')}</div><div class="bank">${q.bank.map((t, i) => tileHTML(t, i, false)).join('')}</div>`;
    canCheck = P.built.length > 0;
  } else if (q.type === 'error') {
    body += `<div class="q-card"><span class="ctx">${esc(q.ctx)}</span></div><div class="tokens">${q.tokens.map((t, i) => {
      let cls = 'tile'; if (P.answered) { if (i === q.wrong) cls += ' opt right'; else if (i === P.sel) cls += ' opt wrong'; } else if (i === P.sel) cls += ' opt sel';
      return `<button class="${cls}" data-act="opt" data-i="${i}" ${P.answered ? 'disabled' : ''}><span class="t-jp ${q.noRomaji ? 'kana' : ''}">${esc(t.jp)}</span>${t.ro && showRo(q) ? `<span class="t-ro">${esc(t.ro)}</span>` : ''}</button>`;
    }).join('')}</div>`;
    canCheck = P.sel !== null;
  } else if (q.type === 'match') {
    const M = P.match || (P.match = { l: null, r: null, done: [], mistakes: 0, missed: new Set() });
    const col = (arr, side) => arr.map(o => {
      const d = M.done.includes(o.i); const sel = M[side] === o.i;
      return `<button class="opt ${d ? 'right gone' : sel ? 'sel' : ''}" data-act="m${side.toUpperCase()}" data-i="${o.i}" ${d || P.answered ? 'disabled' : ''}><span class="${side === 'l' ? 'o-jp' + (o.kana ? ' kana' : '') : ''}">${esc(o.label)}</span>${o.sub && showRo(q) ? `<span class="o-ro">${esc(o.sub)}</span>` : ''}</button>`;
    }).join('');
    body += `<div class="match"><div class="col">${col(q.left, 'l')}</div><div class="col">${col(q.right, 'r')}</div></div>`;
  }
  let foot, footCls = '';
  if (!P.answered) {
    foot = q.type === 'match' ? `<p class="muted" style="margin:0;text-align:center">Toque em um item de cada coluna para formar o par.</p>` : `<button class="btn btn-primary btn-block" data-act="check" ${canCheck ? '' : 'disabled'}>Verificar</button>`;
  } else {
    const ok = P.lastOk; footCls = ok ? 'ok' : 'bad';
    foot = `<div class="fb">${mascot(ok ? 'happy' : 'sad', 54, 'hop')}<div class="fb-text"><h3>${esc(P.fbTitle)}</h3>${!ok && q.answerText ? `<p class="answer">Resposta certa: ${esc(q.answerText)}</p>` : ''}${q.type === 'listen' ? listenReveal(q) : ''}<p>${esc(q.explain || '')}</p></div></div>
      <button class="btn ${ok ? 'btn-ok' : 'btn-bad'} btn-block" data-act="next">Continuar</button>`;
  }
  const prog = P.i / P.qs.length;
  return playerShell(prog, body, foot, footCls, (P.i + 1) + '/' + P.qs.length);
}
function checkAnswer() {
  const q = P.qs[P.i]; if (P.answered) return;
  let ok = false;
  if (q.type === 'mc' || q.type === 'listen') { if (P.sel === null) return; ok = !!q.options[P.sel].correct; }
  else if (q.type === 'num_type') { const v = parseInt(String(P.typed || '').replace(/\D/g, ''), 10); if (isNaN(v)) return; ok = v === q.answer; }
  else if (q.type === 'build') { if (!P.built.length) return; ok = P.built.map(i => q.bank[i].jp).join('|') === q.answer.join('|'); }
  else if (q.type === 'error') { if (P.sel === null) return; ok = P.sel === q.wrong; }
  finishQuestion(ok);
}
function finishQuestion(ok) {
  const q = P.qs[P.i];
  P.answered = true; P.lastOk = ok; P.fbTitle = ok ? pick(MSG.correct) : pick(MSG.wrong);
  sfx(ok ? 'ok' : 'bad');
  const ctx = P.quiz + ':' + (P.L ? P.L.id : P.C ? P.C.id : 'rev');
  if (q.type === 'match') q.items.forEach((id, i) => recordAnswer(id, !P.match.missed.has(i), ctx));
  else recordAnswer(q.itemId, ok, ctx);
  if (q.type === 'listen') recordListen(q, ok);
  if (!q.retry) { P.graded++; if (ok) P.correct++; else P.errors.push(q); }
  let xp = ok ? (P.quiz === 'practice' ? 5 : P.quiz === 'review' || P.quiz === 'listen' ? 6 : P.quiz === 'dialog' || P.quiz === 'case' ? 8 : 10) : 1;
  if (ok && q.hinted) xp = Math.ceil(xp / 2);
  addXP(xp);
  if (P.quiz === 'practice' && !ok && !q.retry) {
    const again = q.type === 'match' ? { ...q, left: shuffle(q.left), right: shuffle(q.right), retry: true } : q.type === 'mc' ? { ...q, options: shuffle(q.options), retry: true } : q.type === 'build' ? { ...q, bank: shuffle(q.bank), retry: true } : { ...q, retry: true };
    P.qs.push(again);
  }
  P.keepScroll = true; renderPlayer();
  const f = $('.p-foot .btn'); if (f) f.focus({ preventScroll: true });
}
function nextQuestion() {
  stopAudio();
  P.i++; P.answered = false; P.sel = null; P.built = []; P.match = null; P.typed = '';
  if (P.i >= P.qs.length) return endQuiz();
  renderPlayer();
}
function endQuiz() {
  if (P.quiz === 'practice') { P.phase = 'examIntro'; renderPlayer(); return; }
  if (endListenQuiz()) return;
  const pct = P.graded ? Math.round(P.correct / P.graded * 100) : 0;
  const pass = pct >= PASS;
  touchStudy();
  if (P.quiz === 'review') {
    S.stats.reviews++; missionEvent('review_done'); addCoins(5);
  } else if (P.kind === 'lesson') {
    const id = P.L.id, r = S.lessons[id] || (S.lessons[id] = { passed: false, best: 0, attempts: 0 });
    const first = pass && !r.passed;
    r.attempts++; r.best = Math.max(r.best, pct); r.last = pct; r.lastAt = Date.now();

function cleanSay(t) { return String(t || '').replace(/[「」『』＿…〜~]/g, ' ').replace(/\s+/g, ' ').trim(); }
function setPlaying(on, key) {
  document.body.classList.toggle('is-playing', !!on);

/* Fala um texto em japonês. Resolve true quando terminou de tocar. Nunca toca dois áudios ao mesmo tempo. */
function speak(text, opts = {}) {
  return new Promise(resolve => {
    if (!AUDIO.supported || AUDIO.status === 'unsupported') { AUDIO.status = 'unsupported'; audioProblem(); return resolve(false); }
    if (AUDIO.status === 'missing') { audioProblem(); return resolve(false); }
    const my = ++AUDIO.token;
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(() => {
      if (my !== AUDIO.token) return resolve(false);
      let u;
      try { u = new SpeechSynthesisUtterance(cleanSay(text)); } catch (e) { AUDIO.status = 'unsupported'; audioProblem(); return resolve(false); }
      u.lang = 'ja-JP'; if (AUDIO.ja) u.voice = AUDIO.ja;
      u.rate = opts.rate || RATES[S.settings.rate] || RATES.normal; u.pitch = opts.pitch || 1;
      let started = false;
      const guard = setTimeout(() => {
        if (started || my !== AUDIO.token) return;
        // nada começou a tocar: sem voz utilizável (não fingimos que tocou)
        if (!audioOK()) { AUDIO.status = 'missing'; updateAudioUI(); audioProblem(true); }
        try { speechSynthesis.cancel(); } catch (e) {}
        setPlaying(false); resolve(false);
      }, 4500);
      u.onstart = () => { started = true; if (!audioOK()) { AUDIO.status = 'heard'; updateAudioUI(); } setPlaying(true, opts.key); };
      u.onend = () => { clearTimeout(guard); if (my === AUDIO.token) setPlaying(false); resolve(my === AUDIO.token && started); };
      u.onerror = e => {
        clearTimeout(guard); if (my === AUDIO.token) setPlaying(false);
        if (e && /language-unavailable|voice-unavailable|synthesis-unavailable|synthesis-failed/.test(e.error || '')) { AUDIO.status = 'missing'; updateAudioUI(); audioProblem(true); }
        resolve(false);
      };
      try { if (speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.speak(u); } catch (e) { clearTimeout(guard); resolve(false); }
    }, 70);
  });
}
/* toca uma sequência de falas (diálogos), cada personagem com tom diferente */
async function speakSeq(lines) {
  const my = ++AUDIO.token;
  for (let i = 0; i < lines.length; i++) {
    if (my !== AUDIO.token) return false;
    AUDIO.token = my - 1; // speak() incrementa; mantém a sequência como dona do token
    const ok = await speak(lines[i].say || lines[i].jp, { pitch: (CHARS[lines[i].sp] || {}).pitch || 1, key: lines[i].key });
    if (!ok || AUDIO.token !== my) return false;
    await new Promise(r => setTimeout(r, 350));
  }
  return true;
}

/* ==========================================================
   PERGUNTAS AUDITIVAS
   ========================================================== */
const levelNum = l => LV[l] || 1;
function packItems(id) { const p = AUDIO_PACKS.find(x => x.id === id); return p ? p.items : []; }
function listenPool(type, level) {
  const L = levelNum(level);
  const v1 = lids => lids.flatMap(id => LESSON[id] ? LESSON[id].items : []);
  const v1Words = Object.keys(LISTEN_V1).filter(k => +k <= L).flatMap(k => v1(LISTEN_V1[k]));
  const pal = packItems('aud-pal').filter(it => it.lv <= L);
  const expr = packItems('aud-expr').filter(it => it.lv <= L).concat((AUDIO_PACKS.find(p => p.id === 'aud-expr').refs || []).map(id => ITEM[id]).filter(Boolean));
  const fra = packItems('aud-fra').filter(it => it.lv <= L).concat(Object.keys(LISTEN_V1_FRASES).filter(k => +k <= L).flatMap(k => v1(LISTEN_V1_FRASES[k])));
  const ani = packItems('aud-ani').filter(it => it.lv <= L && it.kind === 'palavra');
  if (type === 'palavra') return v1Words.concat(pal, L >= 3 ? ani.filter(it => S.discoveries[it.id]) : []);
  if (type === 'expressao') return packItems('aud-expr').concat(expr.filter(it => !it.id.startsWith('aud-expr')));
  if (type === 'frase') return L === 1 ? expr.concat(v1(['c5l1'])) : fra.filter(it => L === 3 ? (it.lv === 3 || it.lesson.kind === 'grammar') : true);
  if (type === 'anime') return packItems('aud-ani');
  return v1Words.concat(pal, expr, L >= 2 ? fra : []);
}
function groupOf(it) {
  if (it.group) return it.group;
  const l = it.lesson;
  if (l.kind === 'grammar') return 'frase';
  if (l.id === 'c1l3' || l.id === 'c1l4') return 'expressao';
  return 'palavra';
}
function sayOf(it) { return it.say || it.jp; }
function ptDistractors(it, pool, n = 3) {
  const seen = new Set([it.pt]), out = [];
  const g = groupOf(it);
  const cands = shuffle(pool.filter(x => groupOf(x) === g)).concat(shuffle(pool), shuffle(Object.values(ITEM).filter(x => groupOf(x) === g)));
  for (const x of cands) { if (out.length >= n) break; if (x === it || seen.has(x.pt)) continue; seen.add(x.pt); out.push(x); }
  return out;
}
function genListenQ(it, mode = 'word', level = 'iniciante', pool) {
  pool = pool || listenPool(groupOf(it) === 'anime' ? 'anime' : groupOf(it), level);
  const d = ptDistractors(it, pool);
  const g = groupOf(it);
  const prompt = mode === 'case' ? 'Investigue: o que significa a palavra que você ouviu?' : g === 'frase' ? 'O que foi dito?' : g === 'expressao' ? 'O que significa a expressão que você ouviu?' : 'O que significa a palavra que você ouviu?';
  return {
    type: 'listen', mode, lvl: level, itemId: it.id, say: sayOf(it), jp: it.jp, ro: it.ro, pt: it.pt,
    prompt, ctx: mode === 'case' ? it.clue : '', allowRoHint: levelNum(level) < 3 && mode !== 'case',
    options: shuffle([it, ...d]).map(x => ({ label: x.pt, plain: true, correct: x === it })),
    answerText: it.pt, explain: (it.note || it.when || '') + (it.formal ? ' ' + it.formal : ''), stat: mode === 'case' ? 'anime' : g
  };
}
function genPronQ(set, level) {
  const items = set.ids.map(id => ITEM[id]).filter(Boolean);
  const it = pick(items);
  return {
    type: 'listen', mode: 'pron', lvl: level, itemId: it.id, say: sayOf(it), jp: it.jp, ro: it.ro, pt: it.pt,
    prompt: 'Qual palavra você ouviu? Preste atenção nos sons longos e nas pausas.', allowRoHint: false, grid: true,
    options: shuffle(items).map(x => ({ label: x.ro, correct: x === it })),
    answerText: it.ro + ' (' + it.pt + ')', explain: items.map(x => x.ro + ' = ' + x.pt).join(' · ') + '. ' + (it.note || ''), stat: 'som'
  };
}
function genDialogQs(dlg) {
  return dlg.qs.map((qq, i) => ({
    type: 'listen', mode: 'dialog', lvl: ['iniciante', 'intermediario', 'avancado'][dlg.lv - 1], itemId: null, dialogId: dlg.id,
    say: null, jp: dlg.lines.map(l => (CHARS[l.sp] || {}).name + ': ' + l.jp).join('\n'), ro: dlg.lines.map(l => l.ro).join(' / '), pt: '',
    prompt: qq.q, allowRoHint: false, options: shuffle(qq.opts.map((o, k) => ({ label: o, plain: true, correct: k === qq.ans }))),
    answerText: qq.opts[qq.ans], explain: qq.explain, stat: 'dialogo'
  }));
}
function buildListenSession(type, level) {
  const L = levelNum(level), qs = [];
  if (type === 'som') {
    const sets = PRON_SETS.filter(s => s.lv <= L);
    const order = shuffle(sets.filter(s => s.lv === L)).concat(shuffle(sets.filter(s => s.lv < L)));
    for (let i = 0; i < 8; i++) qs.push(genPronQ(order[i % order.length], level));
    return qs;
  }
  if (type === 'misto') {
    const words = shuffle(listenPool('palavra', level)).slice(0, 4).map(it => genListenQ(it, 'word', level));
    const fr = shuffle(listenPool('frase', level)).slice(0, 3).map(it => genListenQ(it, 'phrase', level));
    const so = shuffle(PRON_SETS.filter(s => s.lv <= L)).slice(0, 2).map(s => genPronQ(s, level));
    const ex = shuffle(listenPool('expressao', level).filter(it => (it.lv || 1) <= L)).slice(0, 1).map(it => genListenQ(it, 'word', level));
    return shuffle(words.concat(fr, so, ex));
  }
  let pool = listenPool(type, level);
  if (type === 'anime') pool = pool.filter(it => S.discoveries[it.id]);
  // prioriza os itens com mais dificuldade e os nunca ouvidos
  const score = it => { const r = S.items[it.id]; return r ? (r.w * 2 - r.c + (r.due <= Date.now() ? 1 : 0)) : 1.5; };
  const chosen = shuffle(pool).sort((a, b) => score(b) - score(a) + (Math.random() - .5) * 2).slice(0, 10);
  return shuffle(chosen).map(it => genListenQ(it, type === 'frase' ? 'phrase' : 'word', level, pool));
}

/* registra estatísticas auditivas (o SRS já é atualizado por recordAnswer) */
function recordListen(q, ok) {
  const st = S.listening.stats; st.answers++; if (ok) st.correct++;
  const bl = st.byLevel[q.lvl] || (st.byLevel[q.lvl] = { a: 0, c: 0 }); bl.a++; if (ok) bl.c++;
  const bt = st.byType[q.stat] || (st.byType[q.stat] = { a: 0, c: 0 }); bt.a++; if (ok) bt.c++;
  if (ok && q.itemId) { if (q.stat === 'frase') S.listening.phrases[q.itemId] = Date.now(); else S.listening.recognized[q.itemId] = Date.now(); }
  missionEvent('listen');
  save();
}
function recommendLevel() {
  const cur = S.listening.level, L = levelNum(cur), b = S.listening.stats.byLevel[cur] || { a: 0, c: 0 };
  const acc = b.a ? b.c / b.a : 0;
  if (L < 3 && b.a >= 20 && acc >= .85) return { to: LEVELS[L].id, msg: 'Você acertou ' + Math.round(acc * 100) + '% no nível ' + LEVELS[L - 1].name + '. Que tal subir para ' + LEVELS[L].name + '?' };
  if (L > 1 && b.a >= 12 && acc < .5) return { to: LEVELS[L - 2].id, msg: 'Este nível está difícil (' + Math.round(acc * 100) + '% de acertos). Voltar um nível ajuda a fixar a base.' };
  if (b.a < 20) return { to: null, msg: 'Responda ' + (20 - b.a) + ' perguntas neste nível para eu recomendar o próximo passo.' };
  return { to: null, msg: 'Você está indo bem neste nível (' + Math.round(acc * 100) + '% de acertos). Continue praticando!' };
}

    <div class="theory-card">${discoveryHTML(it)}</div>`;
  const next = nextCase(it.id);
  return playerShell(1, body, `${next ? `<button class="btn btn-gold btn-block" data-act="caseNext" data-id="${next.id}">Próximo caso</button>` : ''}<button class="btn btn-ghost btn-block" data-act="pExitTo" data-to="detetive">Ver coleção</button>`);
}
function nextCase(afterId) {
  const list = packItems('aud-ani').filter(it => !S.discoveries[it.id] && it.id !== afterId);
  const L = levelNum(S.listening.level);
  return list.find(it => it.lv <= L) || list[0] || null;
}

const NB_TYPES = [['todas', 'Todas'], ['palavra', 'Palavras'], ['expressao', 'Expressões'], ['anime', 'Animes'], ['frase', 'Frases'], ['dialogo', 'Diálogos'], ['dificeis', 'Mais difíceis']];
const GROUP_LABEL = { palavra: 'Palavra', expressao: 'Expressão', anime: 'Anime', frase: 'Frase', dialogo: 'Diálogo' };
function originOf(it) {
  const l = it.lesson;
  if (l.kind !== 'audio') return l.cat.title + ' · ' + l.title;
  return { 'aud-pal': 'Academia Auditiva · Palavras', 'aud-expr': 'Expressões do Cotidiano', 'aud-fra': 'Academia Auditiva · Frases', 'aud-ani': 'Detetive dos Animes' }[l.id] || 'Academia Auditiva';
}
function viewNotebook() {
  if (!nb.t) nb.t = 'todas';
  const q = nb.q.trim().toLowerCase();
  const statusOk = id => { const s = itemStatus(id); return nb.f === 'todas' || (nb.f === 'dominadas' && s === 'dominada') || (nb.f === 'revisar' && s === 'revisar') || (nb.f === 'aprendendo' && (s === 'aprendendo' || s === 'nova')); };
  const match = (...f) => !q || f.some(x => String(x || '').toLowerCase().includes(q));
  const ids = seenItems();
  let entries = [];
  if (nb.t !== 'dialogo') {
    entries = ids.map(id => ITEM[id]).filter(it => {
      const g = groupOf(it);
      if (nb.t === 'dificeis') { if (!(S.items[it.id].w > 0)) return false; } else if (nb.t !== 'todas' && g !== nb.t) return false;
      return statusOk(it.id) && match(it.jp, it.ro, it.pt, it.kanji, it.say);
    });
    if (nb.t === 'dificeis') entries.sort((a, b) => S.items[b.id].w - S.items[a.id].w);
  }
  const dlgs = (nb.t === 'todas' || nb.t === 'dialogo') && nb.f === 'todas' ? DIALOGS.filter(d => S.listening.dialogs[d.id] && match(d.title, d.situ, ...d.lines.map(l => l.jp + ' ' + l.ro + ' ' + l.pt))) : [];
  const entryHTML = it => {
    const s = itemStatus(it.id), r = S.items[it.id], g = groupOf(it);
    return `<div class="nb-entry"><div class="nb-top"><span class="jpw">${esc(it.jp2 || it.jp)}</span><span class="chip ${s}">${STATUS_LABEL[s]}</span>${speakBtn(sayOf(it))}</div>
      <div><b>${esc(it.pt)}</b> <span class="ro">· ${esc(it.ro)}${it.alt ? ' · também ' + esc(it.alt) : ''}</span>${it.kanji ? ` <span class="ro">· kanji: <span class="jp">${esc(it.kanji)}</span></span>` : ''}</div>
      ${it.note ? `<div class="muted" style="font-size:.88rem">${esc(it.note)}</div>` : ''}
      ${it.when ? `<div class="muted" style="font-size:.88rem">Quando usar: ${esc(it.when)}</div>` : ''}
      ${it.ex ? `<div class="nb-ex"><span class="jp" style="font-weight:700">${esc(it.ex.jp)}</span><br><span class="ro">${esc(it.ex.ro)}</span><br>${esc(it.ex.pt)}</div>` : ''}
      <div class="nb-meta"><span class="chip nova">${GROUP_LABEL[g]}</span><span>${esc(originOf(it))}</span><span>· desde ${new Date(r.seen).toLocaleDateString('pt-BR')}</span>${r.c + r.w ? `<span class="tabnum">· ${r.c} acerto${r.c === 1 ? '' : 's'}, ${r.w} erro${r.w === 1 ? '' : 's'}</span>` : ''}${g === 'anime' ? `<button class="link-btn" style="padding:0" data-act="discOpen" data-id="${it.id}">Ver descoberta</button>` : ''}</div></div>`;
  };
  // agrupa pela origem, mantendo a ordem do conteúdo
  const order = ALL_LESSONS.concat(AUDIO_PACKS);
  let groups;
  if (nb.t === 'dificeis') groups = entries.length ? `<section class="section"><div class="card">${entries.map(entryHTML).join('')}</div></section>` : '';
  else groups = order.map(l => { const list = entries.filter(it => it.lesson === l); return list.length ? `<section class="section"><div class="section-h"><h2 style="font-size:1rem">${esc(l.kind === 'audio' ? originOf(list[0]) : l.title)}</h2><span class="muted" style="font-size:.8rem">${esc(l.cat.title)}</span></div><div class="card">${list.map(entryHTML).join('')}</div></section>` : ''; }).join('');
  if (dlgs.length) groups += `<section class="section"><div class="section-h"><h2 style="font-size:1rem">Diálogos concluídos</h2><span class="muted" style="font-size:.8rem">Laboratório de Diálogos</span></div><div class="card">${dlgs.map(d => { const r = S.listening.dialogs[d.id]; return `<div class="nb-entry"><div class="nb-top"><span class="jpw" style="font-size:1.1rem;font-family:var(--f-body)">${esc(d.title)}</span><span class="chip dominada tabnum">${r.best}%</span><button class="icon-btn" data-act="dialog" data-id="${d.id}" aria-label="Abrir diálogo">${IC.play.replace('<svg', '<svg width="18" height="18"')}</button></div>${d.lines.map(l => `<div style="font-size:.9rem"><b>${esc((CHARS[l.sp] || {}).name)}:</b> <span class="jp">${esc(l.jp)}</span><br><span class="ro">${esc(l.ro)}</span> · ${esc(l.pt)}</div>`).join('')}<div class="nb-meta"><span class="chip nova">Diálogo</span><span>concluído em ${new Date(r.at).toLocaleDateString('pt-BR')}</span></div></div>`; }).join('')}</div></section>`;
  const total = entries.length + dlgs.length;
  const fl = [['todas', 'Qualquer status'], ['aprendendo', 'Aprendendo'], ['revisar', 'Revisar'], ['dominadas', 'Dominadas']];
  return `<div class="wrap"><div class="page-title"><div><span class="jp">がくしゅうノート</span><h1>Caderno de Aprendizado</h1></div></div>
    <div class="stack"><input class="search" id="nbSearch" type="search" placeholder="Buscar em japonês, romaji ou português" value="${esc(nb.q)}" aria-label="Buscar no caderno">
    <div class="filters">${NB_TYPES.map(([k, t]) => `<button class="filter ${nb.t === k ? 'on' : ''}" data-act="nbType" data-t="${k}">${t}</button>`).join('')}</div>
    <div class="filters">${fl.map(([k, t]) => `<button class="filter small ${nb.f === k ? 'on' : ''}" data-act="nbFilter" data-f="${k}">${t}</button>`).join('')}</div>
    <p class="muted tabnum" style="margin:0;font-size:.85rem">${ids.length} itens estudados · ${Object.keys(S.listening.dialogs).length} diálogos${q || nb.f !== 'todas' || nb.t !== 'todas' ? ' · ' + total + ' encontrados' : ''}</p></div>
    <div id="nbList">${groups || (ids.length ? '<p class="muted">Nada encontrado com esse filtro.</p>' : `<div class="card mascot-tip" style="margin-top:14px;box-shadow:none">${mascot('neutral', 64)}<div><b>Seu caderno está vazio.</b><p class="muted" style="margin:4px 0 0">As palavras das lições, os treinos auditivos, as expressões e as descobertas do Detetive aparecem aqui, com áudio, romaji, tradução e exemplos.</p></div></div>`)}</div></div>`;
}

/* ==========================================================
   AÇÕES NOVAS
   ========================================================== */
Object.assign(ACT, {
  speak: el => speak(el.dataset.text),
  playQ: () => playQ(),
  rate: el => { S.settings.rate = el.dataset.val; save(); document.querySelectorAll('.rate-seg button').forEach(b => b.classList.toggle('on', b.dataset.val === S.settings.rate)); if (P && P.phase === 'quiz') playQ(); },
  revealJp: () => { const q = P.qs[P.i]; q.revealJp = true; q.hinted = true; P.keepScroll = true; renderPlayer(); },
  hintRo: () => { const q = P.qs[P.i]; q.hintRo = true; q.hinted = true; P.keepScroll = true; renderPlayer(); },
  acadMode: el => { S.settings.academyMode = el.dataset.mode; if (el.dataset.mode === 'aud') aud.sub = 'hub'; save(); render(); window.scrollTo(0, 0); },
  audSub: el => { aud.sub = el.dataset.sub; S.settings.academyMode = 'aud'; render(); window.scrollTo(0, 0); },
  gotoAud: el => { aud.sub = el.dataset.sub || 'hub'; S.settings.academyMode = 'aud'; go('academia'); },
  setLevel: el => { S.listening.level = el.dataset.lv; save(); render(); toast('聴', 'Nível auditivo: ' + LEVELS[levelNum(el.dataset.lv) - 1].name); },
  listen: el => startListen(el.dataset.type),
  listenAgain: () => { const t = P.ltype; closePlayer(); startListen(t); },
  case: el => startCase(el.dataset.id),
  caseNext: el => { closePlayer(); startCase(el.dataset.id); },
  detTab: el => { aud.detTab = el.dataset.t; render(); },
  discOpen: el => { const it = ITEM[el.dataset.id]; if (!it) return; openModal(`${discoveryHTML(it)}<button class="btn btn-primary btn-block" data-act="closeModal">Fechar</button>`); },
  dialog: el => startDialog(el.dataset.id),
  dlgLine: el => { const i = +el.dataset.i, l = P.D.lines[i]; speak(l.say || l.jp, { pitch: (CHARS[l.sp] || {}).pitch, key: i }); },
  dlgAll: () => speakSeq(P.D.lines.map((l, i) => ({ ...l, key: i }))),
  dlgStop: () => stopAudio(),
  dlgShow: el => { P.show[el.dataset.k] = !P.show[el.dataset.k]; P.keepScroll = true; renderPlayer(); },
  dlgQuiz: () => { stopAudio(); setupQuiz(genDialogQs(P.D), 'dialog'); renderPlayer(); },
  dlgAgain: () => { sessionGain = { xp: 0, coins: 0 }; P.phase = 'dialog'; P.startedAt = Date.now(); renderPlayer(); },
  pExitTo: el => { const to = el.dataset.to; closePlayer(); if (to === 'detetive') { aud.sub = 'det'; aud.detTab = 'colecao'; S.settings.academyMode = 'aud'; go('academia'); } },
  nbType: el => { nb.t = el.dataset.t; render(); },
  voiceHelp: async () => {
    openModal(`<h2>Voz japonesa</h2><p style="margin:0" data-audio-status>${esc(audioStatusText())}</p><div id="voiceTest" class="muted" style="font-size:.9rem">Tocando um teste: “こんにちは”...</div>${voiceHelpHTML()}<button class="btn btn-ghost btn-block" data-act="voiceRetest">Testar de novo</button><button class="btn btn-primary btn-block" data-act="closeModal">Fechar</button>`);
    runVoiceTest();
  },
  voiceRetest: () => { if (AUDIO.status === 'missing') AUDIO.status = AUDIO.voices.length ? 'missing' : 'unknown'; refreshVoices(); if (AUDIO.status === 'missing' && !AUDIO.ja) { AUDIO.status = 'unknown'; } runVoiceTest(); }
});
async function runVoiceTest() {
  const box = $('#voiceTest'); if (box) box.textContent = 'Tocando um teste: “こんにちは”...';
  if (AUDIO.status === 'missing') AUDIO.status = 'unknown'; // permite uma nova tentativa real
  const ok = await speak('こんにちは');
  const b = $('#voiceTest'); if (b) b.innerHTML = ok ? '<b style="color:var(--ok)">Funcionou! Você ouviu “konnichiwa”.</b>' : '<b style="color:var(--bad)">Não foi possível tocar a voz japonesa.</b> Siga os passos abaixo.';
  updateAudioUI();
}
// marca expressões como estudadas quando o cartão é aberto
document.addEventListener('toggle', e => { const d = e.target; if (d.classList && d.classList.contains('expr') && d.open) markSeen(d.dataset.id); }, true);

/* ---------- início do app ---------- */
(function init() {
  initAudio();
  applyTheme();
  if (S.profile.onboarded && S.streak.last && dayDiff(S.streak.last, dayKey()) >= 4) pending.push({ type: 'comeback' });
  const h = (location.hash || '').replace('#', '');
  view = VIEWS.includes(h) ? h : 'inicio';
  render();
  checkAchievements();
  saveNow(); // grava o esquema 2 logo após a migração (o backup do esquema 1 já foi guardado)
  setTimeout(flushPending, 400);
  window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (VIEWS.includes(v) && v !== view && !P) { view = v; render(); } });
})();

/* gancho para testes automatizados */
window.__NQ = { get S() { return S; }, get P() { return P; }, get AUDIO() { return AUDIO; }, CATS, LESSON, ITEM, DIALOGS, AUDIO_PACKS, numJp, levelInfo, dayDiff, normalize, setState(s) { S = s; saveNow(); render(); }, suspendSave() { saveSuspended = true; } };

</script>
</body>
</html>
